  <!-- 分享卡片：QQ / 微信 / B站 / 微博 抓的就是这些 -->

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 顶栏：只在窄屏出现（宽屏由左侧导航接管），窄屏保留汉堡菜单 -->
  <header class="site-header">
    <nav class="nav container">
      <a class="nav-logo" href="index.html">✦ <span>tina的小窝</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">首页</a></li>
        <li><a href="about.html">关于我</a></li>
        <li><a href="gal.html">galgame</a></li>
        <li><a href="minigames.html">小游戏</a></li>
        <li><a href="karaoke.html">卡拉OK</a></li>
        <li><a href="contact.html">联系</a></li>
      </ul>
    </nav>
  </header>

  <!-- 左侧导航：桌面端就是全站的主导航（顶栏只在窄屏出现，见 style.css）
       站点是分页的，每个页面是独立文件，所以「当前是哪一页」直接写死在 HTML 里
       （is-active + aria-current），不靠 JS 判断 -->
  <nav class="side-index" id="sideIndex" aria-label="站点导航">
    <a class="side-index-logo" href="index.html">✦ <span>tina的小窝</span></a>
    <ul class="side-index-list">
      <li><a class="side-index-link" href="index.html">主页</a></li>
      <li><a class="side-index-link" href="about.html">关于我</a></li>
      <li><a class="side-index-link" href="gal.html">galgame</a></li>
      <li><a class="side-index-link" href="minigames.html">小游戏</a></li>
      <li><a class="side-index-link is-active" href="karaoke.html" aria-current="page">卡拉OK</a></li>
      <li><a class="side-index-link" href="contact.html">联系</a></li>
    </ul>
  </nav>

  <main>
    <!-- 卡拉OK 歌单：数据手写在 karaoke.js 里，改那个文件即更新本页
         （karaoke.js 必须排在 script.js 之前） -->
    <section class="section" id="karaoke">
      <div class="container">
        <h2 class="section-title">卡拉OK <span class="title-star">✦</span></h2>

        <div class="kara-stats" id="karaStats"></div>

        <div class="kara-controls">
          <div class="kara-chip-row" id="karaCollectionChips" role="group" aria-label="按合集筛选"></div>
          <div class="kara-toolbar">
            <label class="kara-search">
              <span class="sr-only">搜索歌曲</span>
              <input type="search" id="karaSearch" placeholder="搜曲名 / 歌手 / 出处 / 合集 / 标签…" autocomplete="off" />
            </label>
          </div>
        </div>

        <div class="kara-list" id="karaList"></div>
        <p class="kara-empty" id="karaEmpty" hidden></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 tina · Made with ✦ under a starry night</p>
    </div>
  </footer>

</body>
